rootProject.name = 'analise-risco'

// Os modulos vivem em `modulos/`, mas o caminho Gradle segue liso (`:motor-decisao`, nao
// `:modulos:motor-decisao`): a pasta e organizacao de diretorio, nao um projeto intermediario.
['api-analise-risco', 'servico-listas', 'motor-decisao', 'servico-auditoria', 'gerador-trafego']
    .each { modulo ->
        include modulo
        project(":${modulo}").projectDir = file("modulos/${modulo}")
    }
